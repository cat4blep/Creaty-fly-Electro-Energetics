name: Fabric 26.2 build

on:
  push:
    branches: [fabric-26.2]
  pull_request:
    branches: [fabric-26.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@11d4d83c63a6ce61b32d8a9c4faddbdb04fe9917
      - run: chmod +x gradlew
      - run: xvfb-run -a ./gradlew --no-daemon build runClientGameTest
